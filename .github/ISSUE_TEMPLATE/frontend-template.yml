name: "🚀 MVP - Foundation Feature Issue"
description: "Report, suggest, or work on a feature within the MVP Foundation phase of CommunityInk"
title: "[MVP] <Feature Name> — <Short Description>"
labels: ["phase: MVP", "frontend", "backend", "priority: medium"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🌱 MVP - Foundation
        Core functionality to connect the campus community with essential features for students, clubs, and academic management.
        Please fill in the details below clearly and precisely.

  - type: dropdown
    id: feature-area
    attributes:
      label: "🧭 Feature Area"
      description: "Select which module this issue belongs to"
      options:
        - Authentication Flow
        - Announcements Feed
        - Timetable & Calendar
        - Clubs Directory
        - Departments Directory
        - Profile Management
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: "🧠 Feature Overview"
      description: "Briefly describe what this feature does and why it matters."
      placeholder: "e.g. Implement user registration with UG number verification for student identity validation."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ Development Tasks"
      description: "List the specific technical tasks or sub-features required to complete this feature."
      value: |
        - [ ] Task 1
        - [ ] Task 2
        - [ ] Task 3
      render: markdown

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: "List what must be true for this issue to be considered complete."
      value: |
        - [ ] Feature works as intended on staging
        - [ ] UI aligns with Figma design
        - [ ] Tested across devices
        - [ ] Code reviewed and merged to main
      render: markdown

  - type: textarea
    id: api-endpoints
    attributes:
      label: "🔗 API / Backend Requirements"
      description: "If this feature interacts with the backend, list the required endpoints or data models."
      placeholder: "e.g. POST /api/auth/register, GET /api/announcements"

  - type: textarea
    id: design-reference
    attributes:
      label: "🎨 Design Reference"
      description: "Link to Figma wireframe or design prototype (if available)"
      placeholder: "Figma link or design notes"

  - type: textarea
    id: testing-notes
    attributes:
      label: "🧪 Testing Notes"
      description: "Outline how to test this feature manually or automatically."
      placeholder: "e.g. Login with UG20/SCCS/1001 and verify personalized dashboard loads."

  - type: textarea
    id: additional-context
    attributes:
      label: "📎 Additional Context"
      description: "Add any other context, screenshots, or references here."
